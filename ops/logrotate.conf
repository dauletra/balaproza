# Ставится ops/provision.sh в /etc/logrotate.d/qazaqnovel.
#
# push_notifications пишет строку каждую минуту — без ротации
# /var/log/qazaqnovel растёт без остановки. journald сам ротирует лог
# systemd-юнита, но cron-задачи пишут в обычные файлы, и за ними
# ротацию никто, кроме logrotate, не делает.

/var/log/qazaqnovel/*.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    su qazaqnovel qazaqnovel
}
