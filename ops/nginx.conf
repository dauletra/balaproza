# Ставится ops/provision.sh в /etc/nginx/sites-available/qazaqnovel
# (__DOMAIN__ подставляется скриптом). certbot --nginx дописывает сюда же
# блок `listen 443` и редирект с 80 — вручную это делать не нужно.
#
# Числа лимитов и текст CSP — из docs/deploy.md, раздел «Потолок запросов
# на прокси» и «Безопасность». Менять только там же, вместе: иначе
# документ разойдётся с тем, что реально стоит на сервере.

limit_req_zone $binary_remote_addr zone=qn_api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=qn_all:10m rate=600r/m;

upstream qazaqnovel {
    server unix:/run/qazaqnovel/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    client_max_body_size 10M;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://t.me; frame-src https://oauth.telegram.org; connect-src 'self'; font-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    # media/ отдаёт nginx напрямую: через воркер gunicorn значило бы
    # блокировать его на каждой картинке. static/ отдельной location не
    # нужна — её отдаёт whitenoise внутри самого процесса Django.
    location /media/ {
        alias /srv/qazaqnovel/media/;
    }

    location /api/ {
        limit_req zone=qn_api burst=10 nodelay;
        proxy_pass http://qazaqnovel;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=qn_all burst=60 nodelay;
        proxy_pass http://qazaqnovel;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
