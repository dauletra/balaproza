[project]
name = "qazaqnovel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.0.5",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=6.3.0",
]
prod = [
    "gunicorn>=26.0.0",
    # Раздача статики без отдельного nginx. Подключается только при
    # DJANGO_ENV=production и только если установлен — локально и в
    # тестах его нет, и settings это переживает.
    "whitenoise>=6.11.0",
    # Отслеживание ошибок. Клиент Sentry, сервер свой — GlitchTip
    # говорит тем же протоколом, и трейсбеки с детской площадки никуда
    # не уходят. Подключается по тому же правилу, что whitenoise:
    # только в проде и только если установлен.
    "sentry-sdk>=2.20.0",
]
