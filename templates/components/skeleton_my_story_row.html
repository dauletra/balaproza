{% comment %}
    Skeleton для MyStoryRow / LibraryRow — обложка 120×80 слева + контент.
{% endcomment %}
<article aria-hidden="true"
         class="flex flex-col gap-4 rounded-lg border border-slate-200 bg-white p-4 sm:flex-row sm:items-center">
    <span class="block h-[120px] w-[80px] shrink-0 animate-pulse rounded-md bg-slate-200"></span>
    <div class="flex min-w-0 flex-1 flex-col gap-2.5">
        <div class="flex items-start justify-between gap-2">
            <span class="block h-4 w-2/3 animate-pulse rounded-sm bg-slate-200"></span>
            <span class="block h-5 w-20 animate-pulse rounded-pill bg-slate-200"></span>
        </div>
        <span class="block h-3 w-full animate-pulse rounded-sm bg-slate-200"></span>
        <span class="block h-3 w-9/12 animate-pulse rounded-sm bg-slate-200"></span>
        <div class="mt-1 flex gap-3">
            <span class="block h-3 w-14 animate-pulse rounded-sm bg-slate-200"></span>
            <span class="block h-3 w-14 animate-pulse rounded-sm bg-slate-200"></span>
            <span class="block h-3 w-14 animate-pulse rounded-sm bg-slate-200"></span>
        </div>
    </div>
    <div class="flex shrink-0 gap-2">
        <span class="block h-9 w-24 animate-pulse rounded-md bg-slate-200"></span>
        <span class="block h-9 w-28 animate-pulse rounded-md bg-slate-200"></span>
    </div>
</article>
