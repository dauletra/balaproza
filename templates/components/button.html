{% comment %}
    PrimaryButton / SecondaryButton (docs/04.2).
    Высота 37 (base 14px). Радиус md (8). Включает focus-visible из base.

    Параметры:
      label    — текст
      href     — если задан, рендерится <a>; иначе <button>
      type     — для button: 'submit'|'button' (default 'button')
      kind     — 'primary' (заливка brand · default) | 'secondary' (рамка + текст brand)
                  | 'promo' (жёлто-зелёный + красный — только для конкурсов, DEC-08)
      icon     — имя иконки слева (опц.)
      icon_right — имя иконки справа (опц.)
      size     — 'md' (default · h-9 px-5 text-sm) | 'lg' (h-11 px-6 text-base)
      full     — занять всю ширину (boolean)
      disabled — boolean
      aria_label — для иконочной кнопки
{% endcomment %}
{% with k=kind|default:"primary" sz=size|default:"md" %}
{% if href %}<a href="{{ href }}"{% if aria_label %} aria-label="{{ aria_label }}"{% endif %}{% else %}<button type="{{ type|default:'button' }}"{% if disabled %} disabled{% endif %}{% if aria_label %} aria-label="{{ aria_label }}"{% endif %}{% endif %}
   class="inline-flex items-center justify-center gap-2 rounded-md font-sans font-bold transition-colors
          {% if sz == 'lg' %}h-11 px-6 text-base{% else %}h-9 px-5 text-sm{% endif %}
          {% if full %}w-full{% endif %}
          {% if k == 'primary' %}
              bg-brand text-white hover:bg-brand-dark
              {% if disabled %} opacity-50 cursor-not-allowed hover:bg-brand{% endif %}
          {% elif k == 'secondary' %}
              border border-brand bg-white text-brand hover:bg-slate-50
              {% if disabled %} opacity-50 cursor-not-allowed{% endif %}
          {% elif k == 'promo' %}
              bg-promo-cta text-white hover:opacity-90
          {% endif %}">
    {% if icon %}{% include "components/icon.html" with name=icon size=16 only %}{% endif %}
    {% if label %}<span>{{ label }}</span>{% endif %}
    {% if icon_right %}{% include "components/icon.html" with name=icon_right size=16 only %}{% endif %}
{% if href %}</a>{% else %}</button>{% endif %}
{% endwith %}
