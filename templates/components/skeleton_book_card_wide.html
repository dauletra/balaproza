{% comment %}
    Skeleton для DeskBookCardWide — обложка 120×180 слева + меты справа.
    Loading-аналог components/book_card_wide.html.
{% endcomment %}
<article aria-hidden="true"
         class="flex w-full gap-5 rounded-lg border border-slate-200 bg-white p-4">
    <span class="block h-[180px] w-[120px] shrink-0 animate-pulse rounded-md bg-slate-200"></span>
    <div class="flex min-w-0 flex-1 flex-col gap-2.5">
        <span class="block h-5 w-3/4 animate-pulse rounded-sm bg-slate-200"></span>
        <span class="block h-3 w-1/3 animate-pulse rounded-sm bg-slate-200"></span>
        <div class="mt-1 flex gap-1.5">
            <span class="block h-5 w-16 animate-pulse rounded-pill bg-slate-200"></span>
            <span class="block h-5 w-20 animate-pulse rounded-pill bg-slate-200"></span>
        </div>
        <div class="mt-2 flex flex-col gap-2">
            <span class="block h-3 w-full animate-pulse rounded-sm bg-slate-200"></span>
            <span class="block h-3 w-11/12 animate-pulse rounded-sm bg-slate-200"></span>
            <span class="block h-3 w-9/12 animate-pulse rounded-sm bg-slate-200"></span>
        </div>
        <div class="mt-auto flex gap-4 pt-1">
            <span class="block h-3 w-14 animate-pulse rounded-sm bg-slate-200"></span>
            <span class="block h-3 w-14 animate-pulse rounded-sm bg-slate-200"></span>
            <span class="block h-3 w-14 animate-pulse rounded-sm bg-slate-200"></span>
        </div>
    </div>
</article>
